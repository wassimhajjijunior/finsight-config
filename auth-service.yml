server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://auth-db:5432/auth_db
    username: auth_user
    password: auth_pass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: redis
      port: 6379

jwt:
  secret: your-very-long-secret-key-minimum-256-bits-change-this-in-production
  expiration: 86400000
  refresh-expiration: 604800000