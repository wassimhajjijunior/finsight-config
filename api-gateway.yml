server:
  port: 8080

spring:
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:

            # ── PUBLIC ROUTES — no JWT required ──────────────────
            - id: auth-service-public
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
              metadata:
                skip-auth: true

            # ── PROTECTED ROUTES ─────────────────────────────────
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**
              filters:
                - StripPrefix=1

            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**
              filters:
                - StripPrefix=1

            - id: budget-service
              uri: lb://budget-service
              predicates:
                - Path=/api/budgets/**
              filters:
                - StripPrefix=1

            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1

jwt:
  secret: your-very-long-secret-key-minimum-256-bits-change-this-in-production

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus